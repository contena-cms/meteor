name: Tests

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:

env:
  # meteor-docs' production build (nuxt build, run via `turbo run build`) renders every
  # page during @nuxt/content prerender + nuxt-llms generation, which peaks ~7.3GB and
  # OOMs at Node's default ~4GB heap. Raise the ceiling so the build doesn't crash.
  # NOTE: this is a stopgap — the peak scales ~linearly with page count, so it will need
  # revisiting as components grow (durable fix = reduce the prerender/llms memory peak).
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
        if: ${{ github.event.pull_request.head.repo.full_name == 'contena/meteor' }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        if: ${{ github.event.pull_request.head.repo.full_name != 'contena/meteor' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --prefer-offline

      - name: Validate changesets package names
        run: pnpm run validate:changesets

      - name: Validate docs redirects
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm run validate:docs-redirects -- origin/${{ github.base_ref }}
            exit 0
          fi

          pnpm run validate:docs-redirects

      - name: Build packages
        run: pnpm turbo run build

      - name: Lint all
        run: pnpm turbo run lint:all

      - name: Lint css
        run: pnpm turbo run lint:css -- --custom-formatter @csstools/stylelint-formatter-github

      - name: Check formatting
        run: pnpm turbo run format

      - name: Perform typecheck
        run: pnpm turbo run lint:types

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      FIGMA_TOKEN: "FIGMA_TOKEN"
      ADMIN_TOKENS_FILE_KEY: "ADMIN_TOKENS_FILE_KEY"
      PRIMITIVE_TOKENS_FILE_KEY: "PRIMITIVE_TOKENS_FILE_KEY"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          # Full history so `turbo run --affected` can resolve the comparison base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # `--affected` only runs test:unit for packages touched by the PR (and
      # their dependents). This is what gates the expensive meteor-docs test:
      # it runs only when apps/docs — or a workspace dependency it reads, e.g.
      # the component library — changed. Other packages are unaffected in
      # practice since their unchanged tasks are already Turbo cache hits.
      - name: unit
        run: pnpm turbo run test:unit --affected

  circular-dependencies:
    name: Check for circular dependencies (Madge)
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --prefer-offline

      - name: madge
        run: pnpm --filter @contena/meteor-admin-sdk run circular-dependencies

  playwright-run:
    name: Playwright Integration Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs:
      - circular-dependencies
      - unit-tests
      - static-analysis
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --prefer-offline

      - name: Install Playwright
        run: npx playwright install

      - name: Build packages
        run: pnpm turbo run build

      - name: Run e2e tests
        run: pnpm turbo run test:e2e

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nuxt-app--playwright-test-results
          path: examples/nuxt-app/test-results/

  tested-versions:
    name: tested-versions
    runs-on: ubuntu-latest
    outputs:
      first-version: ${{ steps.versions.outputs.first-version }}
      latest-version: ${{ steps.versions.outputs.latest-version }}
      lts-first-version: ${{ steps.versions.outputs.lts-first-version }}
      lts-latest-version: ${{ steps.versions.outputs.lts-latest-version }}
    steps:
      - name: Generate versions
        id: versions
        uses: contena/github-actions/versions@main
