name: create-meteor-extension Integration Tests

on:
  pull_request:

  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-test:
    name: Test CLI with Contena trunk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Setup Contena 6 using contena-cms/setup-contena
      - name: Setup Contena
        uses: contena-cms/setup-contena@v2
        with:
          contena-version: trunk
          contena-repository: contena-cms/contena
          php-version: "8.5"
          # Contena trunk may intentionally pin dependencies with advisories while they are being updated.
          allow-insecure-versions: true
          install: true
          install-locale: en-GB
          install-currency: EUR
          install-admin: true
          env: dev
          path: contena/

      # 2. Checkout meteor repo
      - name: Checkout meteor
        uses: actions/checkout@v6
        with:
          path: meteor/

      # 3. Setup Node.js and pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "pnpm"
          cache-dependency-path: "meteor/pnpm-lock.yaml"

      # 4. Create plugin structure using Contena's plugin:create command
      - name: Create plugin using Contena CLI
        working-directory: contena/
        run: |
          bin/console plugin:create TestExtensionPlugin Test --no-interaction

      # 5. Install meteor dependencies and build CLI
      - name: Install meteor dependencies
        working-directory: meteor/
        run: pnpm install --frozen-lockfile

      - name: Build create-meteor-extension CLI
        working-directory: meteor/
        run: pnpm turbo run build --filter=@contena/create-meteor-extension

      # 6. Generate extension using CLI directly into plugin structure
      - name: Generate meteor extension into plugin
        working-directory: contena/custom/plugins/TestExtensionPlugin/src/Resources/app
        run: |
          node ../../../../../../../meteor/packages/create-meteor-extension/bin/create-meteor-extension --name test-extension --output-dir meteor-app

      # 7. Install generated extension dependencies
      - name: Install extension dependencies
        working-directory: contena/custom/plugins/TestExtensionPlugin/src/Resources/app/meteor-app
        run: pnpm install

      # 8. Build extension
      - name: Build extension
        working-directory: contena/custom/plugins/TestExtensionPlugin/src/Resources/app/meteor-app
        run: pnpm run build

      # 9. Activate plugin in Contena
      - name: Activate plugin
        working-directory: contena/
        run: |
          bin/console plugin:refresh
          bin/console plugin:install --activate TestExtensionPlugin
          bin/console cache:clear

      # 10. Build Contena admin assets
      - name: Build Contena admin
        working-directory: contena/
        run: |
          composer run build:js:admin
          bin/console cache:clear

      # 11. Verify extension files exist
      - name: Verify extension build
        run: |
          echo "Checking extension files..."
          ls -la contena/custom/plugins/TestExtensionPlugin/src/Resources/app/meteor-app/dist/
          echo "Checking for extension in public..."
          ls -la contena/public/bundles/testextensionplugin/

      # 12. Start Contena web server
      - name: Start Contena server
        working-directory: contena/
        run: |
          symfony server:start --allow-http --no-tls --port=8000 -d

      # 13. Wait for server to be ready
      - name: Wait for Contena to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/admin; do sleep 2; done'

      # 14. Install Playwright and run tests
      - name: Install integration test dependencies
        working-directory: meteor/packages/create-meteor-extension/tests/integration
        run: |
          pnpm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: meteor/packages/create-meteor-extension/tests/integration
        env:
          APP_URL: http://localhost:8000
          CONTENA_ADMIN_USERNAME: admin
          CONTENA_ADMIN_PASSWORD: contena
          CI: true
        run: npx playwright test --reporter=github --trace=on-first-retry

      # 15. Upload test results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: integration-test-results
          path: meteor/packages/create-meteor-extension/tests/integration/test-results/
          retention-days: 7
